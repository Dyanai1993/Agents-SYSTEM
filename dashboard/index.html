<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Dashboard</title>
<style>
:root{--bg:#fff;--fg:#1d2330;--mut:#5b6475;--card:#f5f7fa;--line:#d9dee7;--acc:#2f6fed;--ok:#17803d;--warn:#b45309;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e6e9f0;--mut:#9aa3b5;--card:#1b2029;--line:#2c3342;--acc:#6b9bff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
header h1{font-size:17px;margin:0 12px 0 0}
nav button{background:none;border:1px solid var(--line);color:var(--fg);padding:5px 12px;border-radius:99px;cursor:pointer;margin-right:4px}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.msg{border-left:3px solid var(--acc);padding:6px 10px;margin:6px 0;background:var(--card);border-radius:0 8px 8px 0}
.msg.err{border-color:var(--bad)}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:6px 0 0}
details summary{cursor:pointer}.alert{border-left:3px solid var(--bad);padding:4px 10px;margin:4px 0}
</style></head><body>
<header><h1>Agent Dashboard</h1>
<nav><button data-v="overview" class="on">Overview</button><button data-v="activity">Activity</button><button data-v="messages">Messages</button><button data-v="task">Task monitor</button><button data-v="quality">Quality</button><button data-v="approvals">Approvals <span id="badge" class="pill warn" style="display:none"></span></button><button data-v="usage">Usage</button><button data-v="learning">Learning</button><button data-v="alerts">Alerts</button></nav>
<span class="mut" id="stamp"></span></header>
<main id="m"></main>
<script>
"use strict";
let view="overview";
const m=document.getElementById("m");
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else e.setAttribute(k,a[k]);}c.flat().forEach(x=>e.append(x instanceof Node?x:document.createTextNode(String(x??""))));return e;};
const get=async u=>(await fetch(u)).json();
const post=async(u,b)=>{const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json","X-Agentsys":"1"},body:JSON.stringify(b)});return {ok:r.ok,body:await r.json()};};
const stCls=s=>["done"].includes(s)?"ok":["blocked","failed"].includes(s)?"bad":"";
function bar(p){const b=el("div",{class:"bar"}),i=el("i");i.style.width=Math.min(100,Math.round(p*100))+"%";b.append(i);return b;}
async function overview(){
  const o=await get("/api/overview"),w=o.window;m.replaceChildren();
  if(o.bad_lines)m.append(el("div",{class:"card bad"},"Warning: "+o.bad_lines+" unreadable log lines skipped."));
  m.append(el("div",{class:"card"},el("b",{},"Usage window (estimate, not official)"),
    el("div",{},"5 hours: "+Math.round(w.share_5h*100)+"%"),bar(w.share_5h),el("div",{},"7 days: "+Math.round(w.share_7d*100)+"%"),bar(w.share_7d)));
  if(o.alerts.length){const c=el("div",{class:"card"},el("b",{},"Alerts"));o.alerts.slice(-5).forEach(a=>c.append(el("div",{class:"alert"},a.ts.slice(11,19)+" "+a.agent+": "+a.summary)));m.append(c);}
  const need=o.tasks.filter(r=>r.attention);
  if(need.length){const c=el("div",{class:"card"},el("b",{},"Needs you ("+need.length+")"));
    need.forEach(r=>{const a=el("div",{class:"alert",style:"cursor:pointer;"+(r.attention.level==="warn"?"border-color:var(--warn)":"")},el("b",{},r.task_id)," — "+r.attention.text);a.onclick=()=>openTask(r.task_id);c.append(a);});m.append(c);}
  const t=el("table",{},el("thead",{},el("tr",{},...["Task","State","Agent","Last activity","Calls","Fix loops","Tokens (est)","Needs attention"].map(h=>el("th",{},h)))));
  const tb=el("tbody");o.tasks.forEach(r=>{const name=el("td",{style:"cursor:pointer;text-decoration:underline"},r.task_id+" — "+r.title);name.onclick=()=>openTask(r.task_id);
    tb.append(el("tr",{},name,el("td",{},el("span",{class:"pill "+stCls(r.state)},r.state)),el("td",{},r.current_agent||"—"),
    el("td",{class:"mut"},ago(r.idle_min)),el("td",{},r.calls+"/"+(r.call_cap??"?")),el("td",{},r.fix_loops+"/"+(r.fix_cap??"?")),el("td",{},r.tokens_est),
    el("td",{class:r.attention?r.attention.level:"mut"},r.attention?r.attention.text:(r.limit_hits?"limit hit earlier":""))));});
  t.append(tb);m.append(el("div",{class:"card"},o.tasks.length?t:"No tasks yet."),el("div",{class:"mut"},"A task counts as stuck after "+o.stuck_min+" min without activity in an active state."));
}
function ago(min){if(min==null)return "—";if(min<1)return "just now";if(min<120)return Math.round(min)+" min ago";if(min<1440)return Math.round(min/60)+" h ago";return Math.round(min/1440)+" d ago";}
function openTask(id){curTask=id;view="task";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="task"));m.replaceChildren();tick();}
function filters(withType){
  const f=el("div",{class:"card"});
  f.append(el("input",{id:"fq",placeholder:"search"}),el("input",{id:"ft",placeholder:"task id"}),el("input",{id:"fa",placeholder:"agent"}));
  if(withType)f.append(el("input",{id:"fe",placeholder:"event type"}));
  return f;
}
const val=id=>{const e=document.getElementById(id);return e?e.value:""};
async function activity(){
  if(!document.getElementById("fq")){m.replaceChildren(filters(true),el("div",{id:"list"}));}
  const p=new URLSearchParams({q:val("fq"),task:val("ft"),agent:val("fa"),type:val("fe")});[...p].forEach(([k,v])=>{if(!v)p.delete(k)});
  const r=await get("/api/events?"+p),t=el("table");
  r.events.slice().reverse().forEach(e=>t.append(el("tr",{},el("td",{class:"mut"},e.ts.slice(11,19)),el("td",{},e.task_id),el("td",{},e.agent),
    el("td",{},el("span",{class:"pill"},e.event_type)),el("td",{class:e.status==="error"||e.status==="blocked"?"bad":""},e.summary),el("td",{class:"mut"},e.tokens_estimate||""))));
  document.getElementById("list").replaceChildren(el("div",{class:"card"},t));
}
async function messages(){
  if(!document.getElementById("fq")){m.replaceChildren(filters(false),el("div",{id:"list"}));}
  const p=new URLSearchParams({task:val("ft")});if(!val("ft"))p.delete("task");
  const r=await get("/api/messages?"+p),box=el("div",{});
  const q=val("fq").toLowerCase(),ag=val("fa");
  for(const e of r.events.slice().reverse()){
    if(ag&&e.agent!==ag)continue;if(q&&!JSON.stringify(e).toLowerCase().includes(q))continue;
    const d=el("details",{class:"msg"+(e.status==="error"?" err":"")},el("summary",{},e.ts.slice(11,19)+"  "+(e.from||"?")+" → "+(e.to||"?")+"  ["+e.task_id+"]  "+e.summary));
    d.addEventListener("toggle",async()=>{if(d.open&&!d.dataset.l&&e.payload_ref){d.dataset.l=1;const pl=await get("/api/payload?ref="+encodeURIComponent(e.payload_ref));d.append(el("pre",{},JSON.stringify(pl,null,2)));}});
    box.append(d);
  }
  document.getElementById("list").replaceChildren(box.children.length?box:el("div",{class:"card"},"No messages."));
}
let curTask="";
async function task(){
  const o=await get("/api/overview");
  if(!curTask&&o.tasks.length)curTask=o.tasks[0].task_id;
  const t=curTask?await get("/api/task?id="+encodeURIComponent(curTask)):null;   // fetch BEFORE clearing: no blank flash on refresh
  m.replaceChildren();
  const sel=el("select",{});o.tasks.forEach(x=>{const op=el("option",{value:x.task_id},x.task_id+" — "+x.title);if(x.task_id===curTask)op.selected=true;sel.append(op);});
  sel.onchange=()=>{curTask=sel.value;tick();};m.append(el("div",{class:"card"},sel));
  if(!t||t.error){m.append(el("div",{class:"card"},curTask?"Task not found.":"No tasks yet."));return;}
  const cur=t.state.state||"",b=t.budget;
  const flow=el("div",{class:"card"});
  t.states.forEach((s,i)=>{const p=el("span",{class:"pill",style:"margin-right:4px;"+(s===cur?"background:var(--acc);color:#fff":"")},s);flow.append(p);});
  if(["blocked","failed","paused"].includes(cur))flow.append(el("span",{class:"pill bad"},cur));
  if(t.state.waiting_approval)flow.append(el("span",{class:"pill warn"},"waiting for approval"));
  const ctl=el("div",{class:"card"});
  [["pause","Pause"],["resume","Resume"],["stop","Stop"]].forEach(([a,l])=>{const b=el("button",{style:"margin-right:6px"},l);b.onclick=async()=>{if(a==="stop"&&!confirm("Stop task "+curTask+"?"))return;const r=await post("/api/control",{task_id:curTask,action:a});if(!r.ok)alert(r.body.error);tick();};ctl.append(b);});
  ctl.append(el("span",{class:"mut"},"  (writes a control file; the loop reads it before every agent call)"));
  m.append(flow);
  if(t.attention)m.append(el("div",{class:"card alert",style:t.attention.level==="warn"?"border-color:var(--warn)":""},el("b",{},"Needs you: "),t.attention.text));
  m.append(ctl);
  // plan and dependencies
  const wk=el("div",{class:"card"},el("b",{},"Plan and dependencies"),el("span",{class:"mut"},"  last activity "+ago(t.idle_min)));
  if(t.work.items.length){
    const wt=el("table",{},el("tr",{},...["Item","Title","Depends on","Criteria","Status"].map(h=>el("th",{},h))));
    const sc=s=>s==="done"?"ok":s.startsWith("stopped")?"bad":s.startsWith("in progress")?"warn":"mut";
    t.work.items.forEach(w=>wt.append(el("tr",{},el("td",{},el("b",{},w.id)),el("td",{},w.title),el("td",{class:"mut"},w.depends_on.length?w.depends_on.join(", "):"—"),
      el("td",{class:"mut"},w.criteria),el("td",{},el("span",{class:"pill "+sc(w.status)},w.status)))));
    t.work.steps.forEach(s=>wt.append(el("tr",{},el("td",{},el("b",{},s.id)),el("td",{},s.title),el("td",{class:"mut"},s.id==="FINAL"?"all items":"FINAL"),el("td",{}),
      el("td",{},el("span",{class:"pill "+(s.status==="done"?"ok":s.status==="next"?"warn":"mut")},s.status)))));
    wk.append(wt);
  } else wk.append(el("div",{class:"mut"},t.plan?"The plan has no work items (status: "+t.plan.status+").":"No plan yet."));
  m.append(wk);
  if(t.tainted)m.append(el("div",{class:"card alert"},el("b",{},"Workspace needs restoring: "),"a "+t.tainted.role+" call changed files that could not be reverted. Restore: git -C tasks/"+t.task_id+"/workspace reset --hard "+t.tainted.head.slice(0,12)+" and git clean -fd, then retry. (Or delete tasks/"+t.task_id+"/workspace_tainted.json to keep the workspace as it is.)"));
  // security review
  const sec=el("div",{class:"card"},el("b",{},"Security review"));
  if(!t.security)sec.append(el("div",{class:"mut"},"Not run yet."));
  else{sec.append(el("div",{class:t.security.verdict==="pass"?"ok":t.security.verdict==="fail"?"bad":"warn"},t.security.verdict+" — "+t.security.summary));
    if(t.security.findings.length){const st=el("table",{},el("tr",{},...["Severity","Category","File","Description"].map(h=>el("th",{},h))));
      t.security.findings.forEach(f=>st.append(el("tr",{},el("td",{class:["high","critical"].includes(f.severity)?"bad":"warn"},f.severity),el("td",{},f.category),el("td",{class:"mut"},f.file+(f.line?":"+f.line:"")),el("td",{},f.description))));
      sec.append(st);}}
  m.append(sec);
  // cost
  const c=t.costs,cnt=(n,v,cap)=>el("div",{},n+": "+v+"/"+(cap??"?"));
  const ct=el("table",{},el("tr",{},el("th",{},"Agent"),el("th",{},"Calls"),el("th",{},"Tokens (est)")));
  Object.keys(c.calls_by_agent).forEach(a=>ct.append(el("tr",{},el("td",{},a),el("td",{},c.calls_by_agent[a]),el("td",{},c.tokens_by_agent[a]??"—"))));
  m.append(el("div",{class:"card"},el("b",{},"Cost (subscription usage, estimates)"),
    el("div",{},"Tokens: "+c.tokens_total+" of a "+(c.token_cap??"?")+" cap"),c.token_cap?bar(c.tokens_total/c.token_cap):"",
    el("div",{},"By model: "+(Object.entries(c.tokens_by_model).map(([k,v])=>k+" "+v).join(", ")||"—")),
    el("div",{class:"mut"},"Agent time: "+Math.round(c.agent_seconds/60)+" min"),
    cnt("Agent calls",b.calls??0,b.call_cap),cnt("Fix loops",b.fix_loops??0,b.fix_cap),cnt("Re-plans",b.replans??0,b.replan_cap),ct,
    el("div",{class:"mut"},t.has_status_report?"status_report.md exists in the task folder":"")));
  const tb=el("table",{},el("tr",{},...["Time","Agent","Model","Type","Summary","Status"].map(h=>el("th",{},h))));
  t.events.forEach(e=>tb.append(el("tr",{},el("td",{class:"mut"},e.ts.slice(11,19)),el("td",{},e.agent),el("td",{class:"mut"},e.model),el("td",{},el("span",{class:"pill"},e.event_type)),
    el("td",{},e.summary),el("td",{class:e.status==="error"||e.status==="blocked"?"bad":"ok"},e.status))));
  m.append(el("div",{class:"card"},tb));
}
async function quality(){
  const r=await get("/api/quality");m.replaceChildren();
  if(!r.tasks.length){m.append(el("div",{class:"card"},"No tasks yet."));return;}
  r.tasks.forEach(t=>{
    const c=el("div",{class:"card"},el("b",{},t.task_id),el("span",{class:"mut"},"  fix loops "+t.fix_loops+"/"+(t.fix_cap??"?")+", re-plans "+t.replans));
    const trend=el("div",{style:"margin:6px 0"});
    t.reports.forEach(x=>trend.append(el("span",{class:"pill "+(x.verdict==="pass"?"ok":x.verdict==="fail"?"bad":"warn"),style:"margin-right:4px",title:x.item},x.verdict==="pass"?"✔ "+x.item:"✖ "+x.item)));
    c.append(trend);
    const last=t.reports[t.reports.length-1];
    if(last){const d=el("details",{},el("summary",{},"Latest report: "+last.verdict+" — "+last.summary+" ("+last.pass+" pass, "+last.fail+" fail, "+last.skipped+" skipped)"));
      const tb=el("table",{},el("tr",{},...["Check","Result","Evidence"].map(h=>el("th",{},h))));
      last.checks.forEach(k=>tb.append(el("tr",{},el("td",{},k.name),el("td",{class:k.result==="pass"?"ok":k.result==="fail"?"bad":"warn"},k.result),el("td",{},el("pre",{},(k.evidence||"").slice(0,600))))));
      d.append(tb);c.append(d);}
    else c.append(el("div",{class:"mut"},"No test reports yet."));
    m.append(c);});
}
async function approvals(){
  const r=await get("/api/approvals");m.replaceChildren();
  const c=el("div",{class:"card"},el("b",{},"Pending ("+r.pending.length+")"));
  if(!r.pending.length)c.append(el("div",{class:"mut"},"Nothing is waiting for you."));
  r.pending.forEach(a=>{
    const box=el("div",{class:"msg"},el("div",{},el("span",{class:"pill warn"},a.gate)," ",a.task_id+" — "+a.task_title+" ["+a.task_state+"]"),el("pre",{},a.context));
    const note=el("input",{placeholder:"note (optional)"});
    [["approved","Approve"],["rejected","Reject"]].forEach(([d,l])=>{const b=el("button",{style:"margin:6px 6px 0 0"},l);b.onclick=async()=>{const x=await post("/api/approval/decide",{id:a.id,decision:d,note:note.value});if(!x.ok)alert(x.body.error);tick();};box.append(b);});
    box.append(note);c.append(box);});
  m.append(c);
  const hist=el("table",{},el("tr",{},...["When","Task","Gate","Decision","Note"].map(h=>el("th",{},h))));
  r.history.forEach(x=>hist.append(el("tr",{},el("td",{class:"mut"},(x.decided_at||"").slice(0,16)),el("td",{},x.task_id),el("td",{},x.gate),el("td",{class:x.decision==="approved"?"ok":"bad"},x.decision),el("td",{},x.note))));
  m.append(el("div",{class:"card"},el("b",{},"History"),hist));
}
async function usage(){
  const r=await get("/api/usage"),w=r.window;m.replaceChildren();
  m.append(el("div",{class:"card"},el("b",{},"Window (estimate)"),el("div",{},"5 hours: "+Math.round(w.share_5h*100)+"%"),bar(w.share_5h),el("div",{},"7 days: "+Math.round(w.share_7d*100)+"%"),bar(w.share_7d),el("div",{class:"mut"},r.note)));
  const agg=(t,o)=>{const tb=el("table",{},el("tr",{},el("th",{},t),el("th",{},"Tokens (7 days)")));Object.entries(o).forEach(([k,v])=>tb.append(el("tr",{},el("td",{},k),el("td",{},v))));return el("div",{class:"card"},tb);};
  m.append(agg("Agent",r.by_agent_7d),agg("Model",r.by_model_7d));
  const tb=el("table",{},el("tr",{},...["Task","Calls","Fix loops","Re-plans","Tokens"].map(h=>el("th",{},h))));
  r.tasks.forEach(t=>tb.append(el("tr",{},el("td",{},t.task_id),el("td",{},t.calls+"/"+t.call_cap),el("td",{},t.fix_loops+"/"+t.fix_cap),el("td",{},t.replans+"/"+t.replan_cap),el("td",{},t.tokens_est))));
  m.append(el("div",{class:"card"},tb));
  const hits=el("div",{class:"card"},el("b",{},"Limit hits"));
  if(!r.limit_hits.length)hits.append(el("div",{class:"mut"},"None."));
  r.limit_hits.forEach(h=>hits.append(el("div",{class:"alert"},h.ts+" "+h.task_id+": "+h.info)));m.append(hits);
}
async function alerts(){
  const r=await get("/api/alerts");m.replaceChildren();
  const c=el("div",{class:"card"},el("b",{},"Alerts ("+r.items.length+")"));
  if(!r.items.length)c.append(el("div",{class:"ok"},"All clear."));
  r.items.forEach(a=>c.append(el("div",{class:"alert",style:a.level==="warn"?"border-color:var(--warn)":""},(a.task_id?a.task_id+": ":"")+a.text)));
  m.append(c);
}
async function learning(){
  const r=await get("/api/learning");m.replaceChildren();
  m.append(el("div",{class:"card"},el("b",{},"Lessons"),el("div",{class:"mut"},"Inbox: "+r.inbox+" (a review needs "+r.need_for_review+"; run `orch.py review-lessons`). Approve proposals in the Approvals tab."),
    ...(r.lessons.length?r.lessons.map(l=>el("div",{},l)):[el("div",{class:"mut"},"No lessons yet.")])));
  const pc=el("div",{class:"card"},el("b",{},"Proposals ("+r.proposals.length+")"));
  r.proposals.forEach(p=>{const d=el("details",{},el("summary",{},p.id+" — "+p.target+" — state: "+(p.state||"?")+", approval: "+(p.approval||"?")));
    d.append(el("pre",{},(p.old_text?"- "+p.old_text+"\n":"")+"+ "+p.new_text+"\n\nWhy: "+p.rationale+"\nLessons: "+p.source_lessons.join(", ")+(p.reasons?"\nReverted: "+p.reasons.join("; "):"")+(p.error?"\nError: "+p.error:"")));pc.append(d);});
  if(!r.proposals.length)pc.append(el("div",{class:"mut"},"None."));m.append(pc);
  const cmp=r.comparison;
  if(cmp){const c=el("div",{class:"card"},el("b",{},"Eval comparison: "+cmp.before+" → "+cmp.after),
      el("div",{},"passed "+cmp.pass_before+" → "+cmp.pass_after+", tokens "+cmp.tokens_before+" → "+cmp.tokens_after+" ("+cmp.token_change_pct+"%)"),
      el("div",{class:cmp.regressions.length?"bad":"ok"},cmp.regressions.length?"REGRESSIONS: "+cmp.regressions.join(", "):"No regressions"));
    const tb=el("table",{},el("tr",{},...["Task","Before","After","Fix loops b/a"].map(h=>el("th",{},h))));
    cmp.rows.forEach(x=>tb.append(el("tr",{},el("td",{},x.id),el("td",{class:x.before?"ok":"bad"},String(x.before)),el("td",{class:x.after?"ok":"bad"},String(x.after)),el("td",{},x.fix_before+"/"+x.fix_after))));
    c.append(tb);m.append(c);}
  const rt=el("table",{},el("tr",{},...["Run","Passed","Tokens","Fix loops"].map(h=>el("th",{},h))));
  r.eval_runs.forEach(x=>rt.append(el("tr",{},el("td",{},x.label+" ("+(x.ts||"").slice(0,16)+")"),el("td",{},x.passed+"/"+x.total),el("td",{},x.tokens),el("td",{},x.fix_loops))));
  m.append(el("div",{class:"card"},el("b",{},"Real eval runs"),r.eval_runs.length?rt:el("div",{class:"mut"},"None yet. Run `python evals/run_evals.py real --label baseline --yes`.")));
}
const views={overview,activity,messages,task,quality,approvals,usage,learning,alerts};
async function tick(){try{const ap=await get("/api/approvals");const bd=document.getElementById("badge");bd.style.display=ap.pending.length?"inline":"none";bd.textContent=ap.pending.length;await views[view]();document.getElementById("stamp").textContent="updated "+new Date().toLocaleTimeString();}catch(e){document.getElementById("stamp").textContent="error: "+e.message;}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));m.replaceChildren();tick();});
tick();setInterval(()=>{if(!document.querySelector("details[open]")&&!document.activeElement.matches?.("input"))tick();},2500);
</script></body></html>
