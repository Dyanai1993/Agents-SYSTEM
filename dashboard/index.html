<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Dashboard</title>
<style>
:root{--bg:#fff;--fg:#1d2330;--mut:#5b6475;--card:#f5f7fa;--line:#d9dee7;--acc:#2f6fed;--ok:#17803d;--warn:#b45309;--bad:#b42318;--onacc:#fff}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
header h1{font-size:17px;margin:0 12px 0 0}

.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;overflow-x:auto}

.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}

textarea:disabled{opacity:.7}
.msg{border-left:3px solid var(--acc);padding:6px 10px;margin:6px 0;background:var(--card);border-radius:0 8px 8px 0}
.msg.err{border-color:var(--bad)}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:6px 0 0}
details summary{cursor:pointer}.alert{border-left:3px solid var(--bad);padding:4px 10px;margin:4px 0}
[hidden]{display:none!important}.small{font-size:12px}
.wbar{flex-basis:100%;display:flex;gap:8px;align-items:center;font-size:13px}.wbar i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut)}
.wbar.ok i{background:var(--ok)}.wbar.warn i{background:var(--warn)}.wbar.bad i{background:var(--bad)}.wbar.bad span{color:var(--bad)}
button.primary{background:var(--acc);color:var(--onacc);border:1px solid var(--acc);border-radius:8px;padding:6px 16px;cursor:pointer;font:inherit}
button.primary:disabled{opacity:.45;cursor:default}
/* Requirements Assistant chat */
.awrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.awrap>.card{flex:1 1 400px;min-width:0}
.chat{display:flex;flex-direction:column}
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:calc(100vh - 330px);overflow-y:auto;padding:12px 4px;margin:8px 0;border-block:1px solid var(--line)}
.row{display:flex;flex-direction:column;gap:2px;max-width:88%}.row.me{align-self:flex-end;align-items:flex-end}.row.ai{align-self:flex-start;align-items:flex-start}
.who{font-size:12px;color:var(--mut);padding:0 6px}
.bub{padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);max-width:100%}
.bub.me{background:color-mix(in srgb,var(--acc) 14%,var(--bg));border-color:color-mix(in srgb,var(--acc) 35%,var(--bg));border-bottom-right-radius:4px}
.bub.ai{border-bottom-left-radius:4px}.bub.fail{border-color:var(--bad)}
.btxt{white-space:pre-wrap;overflow-wrap:anywhere}
.time{font-size:11px;color:var(--mut);margin-top:4px;text-align:end}
.sys{align-self:center;max-width:90%;font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:99px;padding:2px 12px;text-align:center}
.sugg{margin-top:8px}.sugg .lbl{font-size:12px;color:var(--warn)}
.chip{display:inline-block;margin:4px 6px 0 0;padding:3px 10px;border-radius:12px;border:1px solid var(--warn);background:none;color:var(--fg);font:inherit;font-size:13px;text-align:start}
button.chip{cursor:pointer}button.chip:hover{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.compose .crow{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;resize:none;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:320px}
.compose textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.compose .send{background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:8px 18px;cursor:pointer;font:inherit}
.compose .send:disabled{opacity:.45;cursor:default}
.hint{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:4px}
</style></head><body>
<header><h1>Agent Dashboard</h1>
<nav><button data-v="assistant">New task</button><button data-v="overview" class="on">Overview</button><button data-v="activity">Activity</button><button data-v="messages">Messages</button><button data-v="task">Task monitor</button><button data-v="quality">Quality</button><button data-v="approvals">Approvals <span id="badge" class="pill warn" style="display:none"></span></button><button data-v="usage">Usage</button><button data-v="learning">Learning</button><button data-v="alerts">Alerts</button></nav>
<span class="mut" id="stamp"></span>
<div id="wbar" class="wbar" role="status" aria-live="polite"></div></header>
<main id="m"></main>
<script>

const m=document.getElementById("m");

const stCls=s=>["done"].includes(s)?"ok":["blocked","failed"].includes(s)?"bad":"";

// ---------------- Requirements Assistant ("New task")

// Parts that change without a re-render: [data-since] counts the seconds since that time, [data-after] appears after that many seconds.

// A re-render rebuilds every box: the box you were typing in gets its focus, cursor and scroll back (boxes with data-key).

        if(r.ok){delete typed["msg:new"];delete flash["msg:new"];curDraft=r.body.session;wantFocus="msg:"+r.body.session;}else flash["msg:new"]={cls:"bad",text:r.body.error};tick();}}));

const views={assistant:assistantView,overview,activity,messages,task,quality,approvals,usage,learning,alerts};
// The worker's heartbeat (state/workers/*.json): is anything alive, what is it doing, does it run current code.
let workerState={processes:[],level:"warn",text:""};
function renderWorker(w){workerState=w;const b=document.getElementById("wbar");b.className="wbar "+w.level;b.replaceChildren(el("i",{"aria-hidden":"true"}),el("span",{},w.text));}
function liveJob(id){return (workerState.processes||[]).find(p=>p.alive&&p.job&&p.job.kind==="task"&&p.job.id===id);}
function workerOffline(){return !(workerState.processes||[]).some(p=>p.alive&&p.kind==="worker");}
function go(v){view=v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));m.replaceChildren();tick();}
async function tick(auto){try{const [ap,w]=await Promise.all([get("/api/approvals"),get("/api/worker")]);renderWorker(w);const bd=document.getElementById("badge");bd.style.display=ap.pending.length?"inline":"none";bd.textContent=ap.pending.length;await views[view](auto);document.getElementById("stamp").textContent="updated "+new Date().toLocaleTimeString();}catch(e){document.getElementById("stamp").textContent="error: "+e.message;}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));m.replaceChildren();tick();});
// A rebuild closes an open native dropdown (seen: the task picker shut after a second): hold the refresh while a
// dropdown is in use - from focus/click until you pick, leave it, or 15 s pass.
let holdUntil=0;
["focusin","mousedown","keydown"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.matches?.("select"))holdUntil=Date.now()+15000;}));
["change","focusout"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.matches?.("select"))holdUntil=0;}));
// Auto refresh pauses while you type in a box it cannot restore; boxes with data-key (the assistant chat) keep refreshing.
tick();setInterval(()=>{const a=document.activeElement;if(Date.now()>=holdUntil&&!document.querySelector("details[open]")&&!(a.matches?.("input,textarea")&&!a.dataset.key))tick(true);},2500);
