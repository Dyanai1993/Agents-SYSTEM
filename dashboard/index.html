<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Dashboard</title>
<style>
:root{--bg:#fff;--fg:#1d2330;--mut:#5b6475;--card:#f5f7fa;--line:#d9dee7;--acc:#2f6fed;--ok:#17803d;--warn:#b45309;--bad:#b42318;--onacc:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e6e9f0;--mut:#9aa3b5;--card:#1b2029;--line:#2c3342;--acc:#6b9bff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--onacc:#0b1020}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
header h1{font-size:17px;margin:0 12px 0 0}
nav button{background:none;border:1px solid var(--line);color:var(--fg);padding:5px 12px;border-radius:99px;cursor:pointer;margin-right:4px}
nav button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
nav button:hover:not(.on){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--bg))}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
textarea:disabled{opacity:.7}
/* Controls: one look for every button and dropdown (they were browser defaults). :where() keeps the generic states at
   the lowest specificity, so a button with its own class (nav, chip, send, primary, danger) always wins. */
:root{color-scheme:light dark}
button{font:inherit;font-size:14px;line-height:1.25;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:7px 14px;cursor:pointer;transition:background-color .15s,border-color .15s,box-shadow .15s}
button:where(:hover:not(:disabled)){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--bg))}
button:where(:active:not(:disabled)){transform:translateY(1px)}
button:where(:disabled){opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
button.danger:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 12%,var(--bg));border-color:var(--bad)}
button.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button.small{padding:4px 10px;font-size:13px}
select{appearance:none;-webkit-appearance:none;font:inherit;font-size:14px;color:var(--fg);background-color:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:8px 38px 8px 12px;cursor:pointer;max-width:100%;transition:border-color .15s;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 21px) 55%,calc(100% - 15px) 55%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select:hover{border-color:var(--acc)}
select.picker{width:min(100%,560px)}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
.msg{border-left:3px solid var(--acc);padding:6px 10px;margin:6px 0;background:var(--card);border-radius:0 8px 8px 0}
.msg.err{border-color:var(--bad)}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:6px 0 0}
details summary{cursor:pointer}.alert{border-left:3px solid var(--bad);padding:4px 10px;margin:4px 0}
[hidden]{display:none!important}.small{font-size:12px}
.wbar{flex-basis:100%;display:flex;gap:8px;align-items:center;font-size:13px}.wbar i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut)}
.wbar.ok i{background:var(--ok)}.wbar.warn i{background:var(--warn)}.wbar.bad i{background:var(--bad)}.wbar.bad span{color:var(--bad)}
button.primary{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button.primary:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 82%,var(--fg));border-color:color-mix(in srgb,var(--acc) 82%,var(--fg))}
button.primary:disabled{opacity:.45;cursor:default}
/* Pipeline: where the task stands, one node per step */
.pipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;margin-top:8px}
.node{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px;white-space:nowrap}
.node i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.node.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}.node.done i{background:var(--ok)}
.node.now{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--bg));font-weight:600}.node.now i{background:var(--acc)}
.node.now.live i{animation:pulse 1.4s ease-in-out infinite}
.node.fail{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}.node.fail i{background:var(--bad)}
.node small{font-weight:400;color:var(--mut)}
.link{width:16px;height:2px;background:var(--line);flex:none}.link.done{background:color-mix(in srgb,var(--ok) 60%,var(--line))}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 70%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.node.now.live i{animation:none}}
/* Live terminal: always dark, like a terminal */
.term{background:#0b0f17;color:#d6deeb;border-radius:10px;padding:10px 12px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
  max-height:46vh;min-height:120px;overflow:auto;margin-top:8px;border:1px solid #1f2937}
.term div{white-space:pre-wrap;overflow-wrap:anywhere}.term .t{color:#64748b}.term .ag{color:#67e8f9}.term .tool{color:#fbbf24}
.term .ok{color:#4ade80}.term .bad{color:#f87171}.term .say{color:#94a3b8}.term .end{color:#a5b4fc}
.livechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-left:8px;color:var(--mut)}
.livechip i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s ease-in-out infinite}
#pvhost{max-width:1200px;margin:12px auto 0;padding:0 16px}
#pvhost .card{margin-bottom:0}.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pvhost iframe{display:block;margin:10px auto 0;border:1px solid var(--line);border-radius:16px;background:#fff;height:72vh;width:390px;max-width:100%}
#pvhost iframe.full{width:100%;border-radius:10px}
pre.diff{max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;white-space:pre;word-break:normal}
pre.diff .add{color:var(--ok)}pre.diff .del{color:var(--bad)}pre.diff .hunk{color:var(--acc)}pre.diff .file{font-weight:700}
code{font-size:12px;overflow-wrap:anywhere}
/* Requirements Assistant chat */
.awrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.awrap>.card{flex:1 1 400px;min-width:0}
.chat{display:flex;flex-direction:column}
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:calc(100vh - 330px);overflow-y:auto;padding:12px 4px;margin:8px 0;border-block:1px solid var(--line)}
.row{display:flex;flex-direction:column;gap:2px;max-width:88%}.row.me{align-self:flex-end;align-items:flex-end}.row.ai{align-self:flex-start;align-items:flex-start}
.who{font-size:12px;color:var(--mut);padding:0 6px}
.bub{padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);max-width:100%}
.bub.me{background:color-mix(in srgb,var(--acc) 14%,var(--bg));border-color:color-mix(in srgb,var(--acc) 35%,var(--bg));border-bottom-right-radius:4px}
.bub.ai{border-bottom-left-radius:4px}.bub.fail{border-color:var(--bad)}
.btxt{white-space:pre-wrap;overflow-wrap:anywhere}
.time{font-size:11px;color:var(--mut);margin-top:4px;text-align:end}
.sys{align-self:center;max-width:90%;font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:99px;padding:2px 12px;text-align:center}
.sugg{margin-top:8px}.sugg .lbl{font-size:12px;color:var(--warn)}
.chip{display:inline-block;margin:4px 6px 0 0;padding:3px 10px;border-radius:12px;border:1px solid var(--warn);background:none;color:var(--fg);font:inherit;font-size:13px;text-align:start}
button.chip{cursor:pointer}button.chip:hover{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.compose .crow{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;resize:none;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:320px}
.compose textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.compose .send{background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:8px 18px;cursor:pointer;font:inherit}
.compose .send:disabled{opacity:.45;cursor:default}
.hint{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:4px}
</style></head><body>
<header><h1>Agent Dashboard</h1>
<nav><button data-v="assistant">New task</button><button data-v="overview" class="on">Overview</button><button data-v="activity">Activity</button><button data-v="messages">Messages</button><button data-v="task">Task monitor</button><button data-v="quality">Quality</button><button data-v="approvals">Approvals <span id="badge" class="pill warn" style="display:none"></span></button><button data-v="usage">Usage</button><button data-v="learning">Learning</button><button data-v="alerts">Alerts</button></nav>
<span class="mut" id="stamp"></span>
<div id="wbar" class="wbar" role="status" aria-live="polite"></div></header>
<div id="pvhost" hidden></div>
<main id="m"></main>
<script>
"use strict";
let view="overview";
const m=document.getElementById("m");
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else e.setAttribute(k,a[k]);}c.flat().forEach(x=>e.append(x instanceof Node?x:document.createTextNode(String(x??""))));return e;};
const get=async u=>(await fetch(u)).json();
// Every action goes through here. Seen live: a click while the server was restarting threw a network error, nothing was
// shown, and the button looked untouched after the next refresh - the user believed Start was pressed. Now every failure
// comes back as {ok:false, body:{error}} with what to do; `unknown` = the request may or may not have arrived.
const post=async(u,b)=>{let r;
  try{r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json","X-Agentsys":"1"},body:JSON.stringify(b)});}
  catch(e){return {ok:false,unknown:true,body:{error:"No answer from the dashboard server - is up.py running? Nothing may have been saved: check the status below, then try again."}};}
  let body;try{body=await r.json();}catch(e){body={error:"The server answered "+r.status+" without details."};}
  if(!r.ok&&r.status===404&&body.error==="not found")body.error="This dashboard server does not know this action - it runs old code: restart up.py.";
  return {ok:r.ok,body};};
const stCls=s=>["done"].includes(s)?"ok":["blocked","failed"].includes(s)?"bad":"";
function bar(p){const b=el("div",{class:"bar"}),i=el("i");i.style.width=Math.min(100,Math.round(p*100))+"%";b.append(i);return b;}
// Typed text survives the 2.5 s re-render: every text box is rebuilt from this map.
const typed={},flash={};
function box(key,ph,rows){const t=el("textarea",{rows:rows||3,placeholder:ph,style:"width:100%;font:inherit"});t.value=typed[key]||"";t.oninput=()=>{typed[key]=t.value;};return t;}
function note(key){return flash[key]?el("div",{class:flash[key].cls},flash[key].text):"";}
// ---------------- Requirements Assistant ("New task")
let curDraft=null;const reviewOpen={};
const FIELDS=[["goal","Goal",2],["acceptance_criteria","Acceptance criteria - one per line, each one checkable",5],["constraints","Constraints - one per line",3],["risks","Assumptions - one per line",3],["unknowns","Open questions - one per line; start a line with [BLOCKING] if it must be answered before submitting",3]];
function toText(d,f){if(f==="goal")return d.goal;if(f==="unknowns")return d.unknowns.map(u=>(u.blocking?"[BLOCKING] ":"")+u.question).join("\n");return d[f].join("\n");}
function fromText(f,v){if(f==="goal")return v.trim();const rows=v.split("\n").map(x=>x.trim()).filter(Boolean);
  if(f==="unknowns")return rows.map(r=>/^\[blocking\]/i.test(r)?{question:r.replace(/^\[blocking\]\s*/i,""),blocking:true}:{question:r,blocking:false});return rows;}
function dirtyKeys(sid){return FIELDS.map(([f])=>sid+":"+f).filter(k=>k in typed);}
async function startDraft(){curDraft=null;view="assistant";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="assistant"));wantFocus="msg:new";m.replaceChildren();tick();}
function openDraft(id){curDraft=id;view="assistant";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="assistant"));wantFocus="msg:"+id;m.replaceChildren();tick();}
const MSG_MAX=8000;   // the server's message limit (assistant.MESSAGE_MAX); a test keeps the two equal
let lastSig="",wantFocus=null;
function grow(t){requestAnimationFrame(()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight+2,320)+"px";});}
function hhmm(ts){const d=new Date(ts);if(isNaN(d))return "";const t=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});return d.toDateString()===new Date().toDateString()?t:d.toLocaleDateString([],{month:"short",day:"numeric"})+" "+t;}
function dur(s){s=Math.max(0,Math.round(s));return s<60?s+" s":Math.floor(s/60)+" min "+s%60+" s";}
// Parts that change without a re-render: [data-since] counts the seconds since that time, [data-after] appears after that many seconds.
setInterval(()=>{const now=Date.now()/1000;document.querySelectorAll("[data-since]").forEach(e=>{e.textContent=dur(now-e.dataset.since);});
  document.querySelectorAll("[data-after]").forEach(e=>{e.hidden=now-e.dataset.from<+e.dataset.after;});},1000);
// A re-render rebuilds every box: the box you were typing in gets its focus, cursor and scroll back (boxes with data-key).
function saveFocus(){if(wantFocus)return {key:wantFocus,end:true};const a=document.activeElement;
  return a&&a.dataset&&a.dataset.key&&m.contains(a)?{key:a.dataset.key,s:a.selectionStart,e:a.selectionEnd,top:a.scrollTop}:null;}
function restoreFocus(f){wantFocus=null;if(!f)return;const n=m.querySelector('[data-key="'+CSS.escape(f.key)+'"]');if(!n||n.disabled)return;
  n.focus();const L=n.value.length;try{n.setSelectionRange(f.end?L:f.s,f.end?L:f.e);}catch(e){}if(!f.end)n.scrollTop=f.top;}
function composer(key,{rows,ph,busy,send}){
  const t=el("textarea",{rows:rows||2,placeholder:ph,dir:"auto","data-key":key,"aria-label":"Your message"});t.value=typed[key]||"";
  const b=el("button",{class:"send"},"Send"),cnt=el("span",{class:"cnt"});
  const upd=()=>{const n=t.value.length;cnt.textContent=n.toLocaleString()+" / "+MSG_MAX.toLocaleString()+(n>MSG_MAX?" - too long":"");
    cnt.className=n>MSG_MAX?"bad":n>MSG_MAX*.9?"warn":"mut";b.disabled=busy||!t.value.trim()||n>MSG_MAX;grow(t);};
  const go=async()=>{if(b.disabled)return;b.disabled=true;b.textContent="Sending...";await send(t.value);};
  t.oninput=()=>{typed[key]=t.value;upd();};
  t.onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();go();}};
  b.onclick=go;upd();
  return el("div",{class:"compose"},el("div",{class:"crow"},t,b),
    el("div",{class:"hint"},el("span",{class:"mut"},busy?"You can write your next message while the assistant answers.":"Ctrl+Enter sends. Enter adds a new line."),cnt),note(key));}
function bubble(x,showWho,sid,canUse){
  if(x.edit)return el("div",{class:"sys",dir:"auto"},x.text+"  "+hhmm(x.ts));
  const me=x.from==="user",b=el("div",{class:"bub "+(me?"me":"ai")},el("div",{class:"btxt",dir:"auto"},x.text));
  if(x.suggestions&&x.suggestions.length){
    const s=el("div",{class:"sugg"},el("div",{class:"lbl"},"Proposals - not confirmed by you"+(canUse?". Click one to quote it in your reply:":":")));
    x.suggestions.forEach(g=>{const c=el(canUse?"button":"span",{class:"chip",dir:"auto"},g);
      if(canUse)c.onclick=()=>{const k="msg:"+sid;typed[k]=(typed[k]&&typed[k].trim()?typed[k].trimEnd()+"\n":"")+g;wantFocus=k;tick();};s.append(c);});
    b.append(s);}
  if(x.conflicts&&x.conflicts.length)b.append(list("Conflicts",x.conflicts,"bad"));
  if(x.draft_not_applied)b.append(el("div",{class:"warn small",style:"margin-top:6px"},"This answer was for an older version of the draft - your edit was kept and its proposal was not applied. Ask again if you want it."));
  b.append(el("div",{class:"time"},hhmm(x.ts)));
  return el("div",{class:"row "+(me?"me":"ai")},showWho?el("div",{class:"who"},me?"You":"Assistant"):"",b);}
async function assistantView(auto){
  const ss=await get("/api/assistant/sessions"),v=curDraft?await get("/api/assistant?id="+encodeURIComponent(curDraft)):null;
  const sig=JSON.stringify([curDraft,ss,v]);
  if(auto&&sig===lastSig&&m.querySelector("[data-view=assistant]"))return;   // nothing changed: leave the page (and your typing) alone
  lastSig=sig;
  const old=m.querySelector(".chatlog"),prev=old&&old.dataset.sid===String(curDraft)?{top:old.scrollTop,n:old.dataset.n,bottom:old.scrollHeight-old.scrollTop-old.clientHeight<60}:null;
  const fs=saveFocus();
  m.replaceChildren();
  const top=el("div",{class:"card","data-view":"assistant"},el("b",{},"Requirements Assistant"),el("span",{class:"mut"},"  describe what you want; the assistant asks what it needs and keeps the draft. Nothing is queued until you approve it."));
  const nb=el("button",{class:"primary",style:"margin:8px 6px 0 0"},"Start a new request");nb.onclick=startDraft;top.append(el("div",{},nb));
  const open=ss.sessions.filter(s=>s.status!=="submitted");
  if(ss.sessions.length){const sel=el("select",{class:"picker","aria-label":"Your drafts",style:"margin-top:8px;display:block"});sel.append(el("option",{value:""},"Your drafts ("+open.length+" open)..."));
    ss.sessions.slice().reverse().forEach(s=>{const o=el("option",{value:s.id},s.id+" - "+s.title.slice(0,60)+" ["+s.status+(s.task_id?" "+s.task_id:"")+"]");if(s.id===curDraft)o.selected=true;sel.append(o);});
    sel.onchange=()=>{if(sel.value)openDraft(sel.value);};top.append(sel);}
  m.append(top);
  if(!v||v.error){
    const c=el("div",{class:"card"},el("b",{},"What do you want built?"),
      el("div",{class:"mut",style:"margin-bottom:8px"},"In your own words - Hebrew or English. A rough idea is enough, and you can paste a document (it is treated as source material). The assistant asks what it needs and keeps a draft you can edit."));
    c.append(composer("msg:new",{rows:5,busy:false,ph:"e.g. Make the audio lessons easier for a complete beginner, and let me stop playback anytime",
      send:async text=>{const r=await post("/api/assistant/message",{text});
        if(r.ok){delete typed["msg:new"];delete flash["msg:new"];curDraft=r.body.session;wantFocus="msg:"+r.body.session;}else flash["msg:new"]={cls:"bad",text:r.body.error};tick();}}));
    m.append(c);restoreFocus(fs);return;}
  const sid=v.id,turn=v.turn||{},busy=["pending","running"].includes(turn.status),sub=v.submitted,now=Date.now()/1000;
  const wrap=el("div",{class:"awrap"});
  // conversation
  const conv=el("div",{class:"card chat"},el("div",{},el("b",{},"Conversation"),el("span",{class:"mut"},"  "+sid+" - "+v.summary.status)));
  const log=el("div",{class:"chatlog","data-sid":sid,"data-n":v.conversation.length+":"+(turn.status||""),"aria-live":"polite"});
  let lastAi=-1,prevFrom=null;v.conversation.forEach((x,i)=>{if(x.from==="assistant")lastAi=i;});
  v.conversation.forEach((x,i)=>{log.append(bubble(x,!x.edit&&x.from!==prevFrom,sid,!sub&&i===lastAi));if(!x.edit)prevFrom=x.from;});
  if(busy){const since=turn.status==="running"?(turn.claimed_at||turn.requested_at):turn.requested_at;
    const t=el("div",{class:"bub ai"},el("span",{class:"dots","aria-hidden":"true"},el("i"),el("i"),el("i")),
      turn.status==="running"?"  The assistant is writing  ":"  Waiting for the assistant  ",el("span",{class:"mut small","data-since":since},dur(now-since)));
    if(turn.status==="pending"){const h=el("div",{class:"warn small","data-from":since,"data-after":"20",style:"margin-top:4px"},
      "Still waiting: is python scripts/orch.py assistant running? It answers your messages - the dashboard itself never calls a model.");h.hidden=now-since<20;t.append(h);}
    log.append(el("div",{class:"row ai"},prevFrom==="assistant"?"":el("div",{class:"who"},"Assistant"),t));}

// The worker's heartbeat (state/workers/*.json): is anything alive, what is it doing, does it run current code.
let workerState={processes:[],level:"warn",text:""};
function renderWorker(w){workerState=w;const b=document.getElementById("wbar");b.className="wbar "+w.level;b.replaceChildren(el("i",{"aria-hidden":"true"}),el("span",{},w.text));}
function liveJob(id){return (workerState.processes||[]).find(p=>p.alive&&p.job&&p.job.kind==="task"&&p.job.id===id);}
function workerOffline(){return !(workerState.processes||[]).some(p=>p.alive&&p.kind==="worker");}
function go(v){view=v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));m.replaceChildren();tick();}
async function tick(auto){try{const [ap,w]=await Promise.all([get("/api/approvals"),get("/api/worker")]);renderWorker(w);const bd=document.getElementById("badge");bd.style.display=ap.pending.length?"inline":"none";bd.textContent=ap.pending.length;await views[view](auto);if(view!=="task")syncPreview(null,null);document.getElementById("stamp").textContent="updated "+new Date().toLocaleTimeString();}catch(e){document.getElementById("stamp").textContent="error: "+e.message;}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));m.replaceChildren();tick();});
// A rebuild closes an open native dropdown (seen: the task picker shut after a second): hold the refresh while a
// dropdown is in use - from focus/click until you pick, leave it, or 15 s pass.
let holdUntil=0;
["focusin","mousedown","keydown"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.matches?.("select"))holdUntil=Date.now()+15000;}));
["change","focusout"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.matches?.("select"))holdUntil=0;}));
// Auto refresh pauses while you type in a box it cannot restore; boxes with data-key (the assistant chat) keep refreshing.
tick();setInterval(()=>{const a=document.activeElement;if(Date.now()>=holdUntil&&!document.querySelector("details[open]")&&!(a.matches?.("input,textarea")&&!a.dataset.key))tick(true);},2500);
